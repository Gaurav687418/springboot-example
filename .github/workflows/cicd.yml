name: Deploy App to Azure App Service

on:
  push:
    branches:
      - deploy-to-azure-app-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Project
        run: mvn clean install -DskipTests

      - name: Upload Artifact for deployment job
        uses: actions/upload-artifact@v2
        with:
          name: springboot-example
          path: ${{ github.workspace }}/target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Artifact from build job
        uses: actions/download-artifact@v2
        with:
          name: springboot-example

      - name: Create ZIP for Deployment
        run: |
          mkdir deploy
          cp *.jar deploy/
          cd deploy
          zip -r app.zip .

      - name: Deploy to Azure App Service using FTPS (Zip Deploy)
        run: |
          curl -X POST \
            -u ${{ secrets.FTPS_USERNAME }}:${{ secrets.FTPS_PASSWORD }} \
            --data-binary "@deploy/app.zip" \
            https://${{ secrets.APP_NAME }}.scm.azurewebsites.net/api/zipdeploy
